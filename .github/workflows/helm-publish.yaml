name: helm-publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to package and publish (e.g. v1.2.3)"
        required: true
        type: string

env:
  ASSET_EXTENSIONS: "css,js,map,jpg,jpeg,png,webp,gif,svg,ico,mp4,woff,woff2,ttf,otf,eot"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # Package, push, and sign the Helm chart for a release tag. The shared
  # workflow parses the tag, checks out the matching ref, and injects the
  # short commit SHA into values.yaml for CDN immutable paths.
  publish:
    uses: bcit-tlu/.github/.github/workflows/helm-publish.yaml@main
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      chart_dir: charts
      tag_name: ${{ inputs.tag_name || github.event.release.tag_name }}
      ref: ${{ inputs.tag_name || github.event.release.tag_name }}
      inject_cdn_sha: true
    secrets: inherit

  # Rebuild dist at the release tag and rewrite asset URLs for the STABLE endpoint. Assets cannot be copied from the latest account: the endpoint hostname is baked into the rewritten URLs, and the stable credential has no access to the latest account. Emits the release's short SHA.
  build-stable-assets:
    uses: bcit-tlu/.github/.github/workflows/cdn-build-assets.yaml@main
    permissions:
      contents: read
    with:
      ref: ${{ inputs.tag_name || github.event.release.tag_name }}
      repo_name: ${{ github.event.repository.name }}
      cdn_base_url: ${{ vars.CDN_BASE_URL_STABLE }}
      artifact_name: dist-stable
      asset_extensions: ${{ env.ASSET_EXTENSIONS }}

  # Upload the rewritten dist/ artifacts to the stable CDN account under the release SHA prefix. Authenticates via OIDC (UAMI) scoped to the course-workload-estimator stable container; the 'stable' GitHub Environment is what Azure trusts.
  cdn-upload-stable:
    needs: build-stable-assets
    uses: bcit-tlu/.github/.github/workflows/cdn-upload.yaml@main
    permissions:
      contents: read
      id-token: write
    with:
      dist_dir: "dist"
      artifact_name: "dist-stable"
      destination_prefix: ${{ needs.build-stable-assets.outputs.destination_prefix }}
      cdn_account_name: ${{ vars.CDN_ACCOUNT_NAME_STABLE }}
      repo_name: ${{ github.event.repository.name }}
      asset_extensions: ${{ env.ASSET_EXTENSIONS }}
      auth_mode: oidc
      environment: stable
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_STABLE }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  # Record this release's SHA as a stable CDN asset set, keeping the last N. Runs only after the stable upload so the pointer never references missing assets. OIDC auth via azure/login; the action falls back to --auth-mode login.
  update-stable-history:
    needs: [publish, build-stable-assets, cdn-upload-stable]
    runs-on: ubuntu-latest
    environment: stable
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_STABLE }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: bcit-tlu/.github/.github/actions/cdn-stable-history@main
        with:
          cdn_account_name: ${{ vars.CDN_ACCOUNT_NAME_STABLE }}
          repo_name: ${{ github.event.repository.name }}
          stable_sha: ${{ needs.build-stable-assets.outputs.short_sha }}

  # Remove old SHA prefixes from the stable container. Protected SHAs are tracked in .stable-current and .stable-history. Same OIDC auth as upload.
  cdn-cleanup-stable:
    needs: [build-stable-assets, update-stable-history]
    runs-on: ubuntu-latest
    environment: stable
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_STABLE }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: bcit-tlu/.github/.github/actions/cdn-cleanup@main
        with:
          cdn_account_name: ${{ vars.CDN_ACCOUNT_NAME_STABLE }}
          channel: stable
          repo_name: ${{ github.event.repository.name }}
          sha: ${{ needs.build-stable-assets.outputs.short_sha }}
