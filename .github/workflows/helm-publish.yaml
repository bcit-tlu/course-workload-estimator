name: helm-publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to package and publish (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # Package, push, and sign the Helm chart for a release tag; the shared
  # workflow parses the tag and checks out the matching ref.
  publish:
    uses: bcit-tlu/.github/.github/workflows/helm-publish.yaml@main
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      chart_dir: charts
      tag_name: ${{ inputs.tag_name || github.event.release.tag_name }}
      ref: ${{ inputs.tag_name || github.event.release.tag_name }}
    secrets: inherit
