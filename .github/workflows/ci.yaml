name: "[CI] Lint, build & publish"

# PR runs show PR title; main runs show head commit subject.
run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('PR #{0} — {1}', github.event.pull_request.number, github.event.pull_request.title)
      || format('Head build — {0}', github.event.head_commit.message) }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ASSET_EXTENSIONS: "css,js,map,jpg,jpeg,png,webp,gif,svg,ico,mp4,woff,woff2,ttf,otf,eot"

# Default to least privilege; jobs elevate only when needed.
permissions:
  contents: read

jobs:
  # Chart quality gate: lint, render, and (optionally) schema-validate the
  # Helm chart using the shared reusable workflow.
  helm-lint:
    uses: bcit-tlu/.github/.github/workflows/helm-lint.yaml@main
    permissions:
      contents: read
    with:
      chart_glob: "charts/"
      extra_command: bash tests/helm-cdn-rewrite.sh

  # Build, sign, scan, and publish the OCI image using the shared reusable
  # workflow; also outputs an RC version for the chart publish step.
  build-course-workload-estimator:
    uses: bcit-tlu/.github/.github/workflows/oci-build.yaml@main
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
      actions: read
    with:
      component: course-workload-estimator
      image_name: course-workload-estimator
      context: .
      tag_prefix: "v"
    secrets: inherit

  # Build the static site and rewrite asset URLs for the CDN upload (latest channel). The Docker build happens separately in the build-course-workload-estimator job.
  build-assets:
    if: github.event_name != 'pull_request'
    uses: bcit-tlu/.github/.github/workflows/cdn-build-assets.yaml@main
    permissions:
      contents: read
    with:
      repo_name: ${{ github.event.repository.name }}
      cdn_base_url: ${{ vars.CDN_BASE_URL_LATEST }}
      asset_extensions: ${{ env.ASSET_EXTENSIONS }}

  # Upload the rewritten dist/ artifacts to the latest CDN account under the short-SHA prefix. Authenticates to Azure via OIDC (UAMI) — no SAS token. The 'latest' GitHub Environment is what the Azure federated credential trusts; without it the OIDC subject won't match and login will fail.
  cdn-upload:
    needs: build-assets
    uses: bcit-tlu/.github/.github/workflows/cdn-upload.yaml@main
    permissions:
      contents: read
      id-token: write
    with:
      dist_dir: "dist"
      artifact_name: "dist"
      destination_prefix: ${{ needs.build-assets.outputs.destination_prefix }}
      cdn_account_name: ${{ vars.CDN_ACCOUNT_NAME_LATEST }}
      repo_name: ${{ github.event.repository.name }}
      asset_extensions: ${{ env.ASSET_EXTENSIONS }}
      auth_mode: oidc
      environment: latest
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_LATEST }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  # Remove old CDN SHA prefixes from the latest container. Protected SHAs are tracked in .latest-current and .latest-history. Same OIDC auth as upload.
  cdn-cleanup:
    needs: [cdn-upload, build-assets]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_LATEST }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: bcit-tlu/.github/.github/actions/cdn-cleanup@main
        with:
          cdn_account_name: ${{ vars.CDN_ACCOUNT_NAME_LATEST }}
          channel: latest
          repo_name: ${{ github.event.repository.name }}
          sha: ${{ needs.build-assets.outputs.short_sha }}

  # Package and push the Helm chart for the matching RC image. Runs on main
  # pushes only; version comes from the oci-build reusable workflow.
  helm-publish:
    needs: [helm-lint, build-course-workload-estimator, cdn-upload]
    if: >-
      github.event_name != 'pull_request'
      && needs.build-course-workload-estimator.outputs.rc_version != ''
    uses: bcit-tlu/.github/.github/workflows/helm-publish.yaml@main
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      chart_dir: charts
      version: ${{ needs.build-course-workload-estimator.outputs.rc_version }}
      inject_cdn_sha: true
    secrets: inherit
